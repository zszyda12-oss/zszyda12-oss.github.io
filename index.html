<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Twist Video</title>
  <style>
    * { box-sizing: border-box }
    body { margin: 0; background:#f1f1f1; color:#171717; font:16px Arial,sans-serif }
    header { position:sticky; top:0; z-index:2; display:flex; gap:14px; align-items:center;
      padding:12px 5%; background:white; border-bottom:1px solid #ddd }
    .logo { font-size:22px; font-weight:bold; color:#d22; white-space:nowrap }
    input,button { font:inherit; padding:10px; border:1px solid #bbb; border-radius:5px }
    input { min-width:0 }
    button { cursor:pointer; background:white }
    button:hover { background:#eee }
    .search { flex:1 }
    main { width:min(1000px,92%); margin:24px auto }
    section,.video { background:white; padding:18px; border-radius:8px; margin-bottom:18px }
    .row { display:flex; flex-wrap:wrap; align-items:center; gap:10px }
    .row input { flex:1 }
    .video { display:grid; grid-template-columns:minmax(180px,320px) 1fr; gap:16px }
    video { width:100%; max-height:220px; background:#111; border-radius:6px }
    .muted { color:#666; font-size:14px }
    .danger { color:#b00 }
    #status { margin:12px 0; color:#444 }
    @media(max-width:600px) {
      header { flex-wrap:wrap }
      .search { order:3; flex-basis:100% }
      .video { grid-template-columns:1fr }
    }
  </style>
</head>
<body>
<header>
  <div class="logo">TWIST VIDEO</div>
  <input id="filter" class="search" placeholder="Szukaj filmów">
  <span id="who" class="muted">Niezalogowany</span>
  <button id="logout" hidden>Wyloguj</button>
</header>

<main>
  <div id="status">Łączenie z serwisem…</div>

  <section id="auth">
    <h2>Konto</h2>
    <div class="row">
      <input id="email" type="email" placeholder="E-mail">
      <input id="password" type="password" placeholder="Hasło">
      <button id="signup">Załóż konto</button>
      <button id="login">Zaloguj</button>
    </div>
    <p class="muted">Przy rejestracji może być wymagane potwierdzenie adresu e-mail.</p>
  </section>

  <section id="channel" hidden>
    <h2>Mój kanał</h2>
    <div class="row">
      <input id="channelName" placeholder="Nazwa kanału">
      <button id="saveChannel">Zapisz nazwę</button>
    </div>
  </section>

  <section id="upload" hidden>
    <h2>Dodaj film</h2>
    <div class="row">
      <input id="title" placeholder="Tytuł filmu">
      <input id="videoFile" type="file" accept="video/*">
      <button id="uploadButton">Opublikuj</button>
    </div>
    <p class="muted">Nie wrzucaj prywatnych nagrań. Pliki w publicznym buckecie mogą być oglądane przez osoby mające link.</p>
  </section>

  <h2>Filmy</h2>
  <div id="videos"></div>
</main>

<script type="module">
  import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

  // Wklej swoje Project URL i publishable key między cudzysłowy:
  const SUPABASE_URL = "https://wipqyjrnwbsnexspiqfc.supabase.co";
  const SUPABASE_KEY = "sb_publishable_xdE4hwM_E1cpn6aS8YlSPg_87lW1u_W";
  const db = createClient(SUPABASE_URL, SUPABASE_KEY);

  const $ = id => document.getElementById(id);
  let user = null;
  let allVideos = [];

  function say(text) { $("status").textContent = text; }
  function esc(value="") {
    return String(value).replace(/[&<>"']/g, c =>
      ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" })[c]);
  }

  async function load() {
    const { data: { user: current }, error } = await db.auth.getUser();
    if (error) say(error.message);
    user = current;
    $("who").textContent = user?.email || "Niezalogowany";
    $("logout").hidden = !user;
    $("auth").hidden = !!user;
    $("channel").hidden = !user;
    $("upload").hidden = !user;

    if (user) {
      const { data: ch } = await db.from("channels").select("name").eq("id", user.id).maybeSingle();
      $("channelName").value = ch?.name || "";
    }
    await loadVideos();
  }

  async function loadVideos() {
    const { data, error } = await db.from("videos")
      .select("id,user_id,title,description,storage_path,created_at")
      .order("created_at", { ascending: false });
    if (error) { say("Błąd pobierania filmów: " + error.message); return; }
    allVideos = data || [];
    await drawVideos();
  }

  async function drawVideos() {
    const term = $("filter").value.trim().toLowerCase();
    const list = allVideos.filter(v => v.title.toLowerCase().includes(term));
    if (!list.length) { $("videos").innerHTML = "<p>Nie ma jeszcze filmów.</p>"; return; }

    const { data: channels } = await db.from("channels").select("id,name");
    const names = Object.fromEntries((channels || []).map(c => [c.id, c.name]));
    const cards = await Promise.all(list.map(async v => {
      const { data: file } = db.storage.from("videos").getPublicUrl(v.storage_path);
      const { count: likes } = await db.from("reactions").select("*", { count:"exact", head:true })
        .eq("video_id", v.id).eq("reaction", 1);
      const { count: dislikes } = await db.from("reactions").select("*", { count:"exact", head:true })
        .eq("video_id", v.id).eq("reaction", -1);
      const { data: mine } = user
        ? await db.from("reactions").select("reaction").eq("video_id", v.id).eq("user_id", user.id).maybeSingle()
        : { data:null };
      const { count: subscribed } = user
        ? await db.from("subscriptions").select("*", { count:"exact", head:true })
            .eq("subscriber_id", user.id).eq("channel_id", v.user_id)
        : { count:0 };
      return `<article class="video">
        <video controls preload="metadata" src="${esc(file.publicUrl)}"></video>
        <div>
          <h3>${esc(v.title)}</h3>
          <p class="muted">Kanał: ${esc(names[v.user_id] || "Kanał")} · ${new Date(v.created_at).toLocaleDateString("pl-PL")}</p>
          <button data-react="${v.id}" data-value="1">👍 ${likes || 0}${mine?.reaction === 1 ? " ✓" : ""}</button>
          <button data-react="${v.id}" data-value="-1">👎 ${dislikes || 0}${mine?.reaction === -1 ? " ✓" : ""}</button>
          ${user && user.id !== v.user_id ? `<button data-sub="${v.user_id}">${subscribed ? "Subskrybujesz ✓" : "Subskrybuj kanał"}</button>` : ""}
          ${user?.id === v.user_id ? `<button class="danger" data-delete="${v.id}" data-path="${esc(v.storage_path)}">Usuń film</button>` : ""}
        </div>
      </article>`;
    }));
    $("videos").innerHTML = cards.join("");

    document.querySelectorAll("[data-react]").forEach(b => b.onclick = () => react(b.dataset.react, Number(b.dataset.value)));
    document.querySelectorAll("[data-sub]").forEach(b => b.onclick = () => subscribe(b.dataset.sub));
    document.querySelectorAll("[data-delete]").forEach(b => b.onclick = () => removeVideo(b.dataset.delete, b.dataset.path));
  }

  $("signup").onclick = async () => {
    const { error } = await db.auth.signUp({ email:$("email").value, password:$("password").value });
    say(error ? error.message : "Sprawdź pocztę i potwierdź konto, jeśli Supabase tego wymaga.");
    await load();
  };

  $("login").onclick = async () => {
    const { error } = await db.auth.signInWithPassword({ email:$("email").value, password:$("password").value });
    say(error ? error.message : "Zalogowano.");
    await load();
  };

  $("logout").onclick = async () => { await db.auth.signOut(); await load(); say("Wylogowano."); };

  $("saveChannel").onclick = async () => {
    if (!user) return;
    const name = $("channelName").value.trim();
    if (!name) return say("Wpisz nazwę kanału.");
    const { error } = await db.from("channels").upsert({ id:user.id, name, description:"" });
    say(error ? error.message : "Nazwa kanału zapisana.");
    await loadVideos();
  };

  $("uploadButton").onclick = async () => {
    if (!user) return say("Najpierw się zaloguj.");
    const file = $("videoFile").files[0];
    const title = $("title").value.trim();
    if (!file || !title) return say("Wpisz tytuł i wybierz plik wideo.");
    const path = `${user.id}/${crypto.randomUUID()}-${file.name.replace(/[^a-zA-Z0-9._-]/g, "_")}`;
    say("Wysyłanie filmu…");
    const { error: uploadError } = await db.storage.from("videos").upload(path, file);
    if (uploadError) return say("Upload nieudany: " + uploadError.message);
    const { error } = await db.from("videos").insert({
      user_id:user.id, title, description:"", storage_path:path
    });
    if (error) return say("Plik wysłano, ale zapis filmu nie powiódł się: " + error.message);
    $("title").value = "";
    $("videoFile").value = "";
    say("Film opublikowany.");
    await loadVideos();
  };

  async function react(videoId, value) {
    if (!user) return say("Zaloguj się, aby oceniać filmy.");
    const { data: old } = await db.from("reactions").select("reaction")
      .eq("user_id", user.id).eq("video_id", videoId).maybeSingle();
    const result = old?.reaction === value
      ? await db.from("reactions").delete().eq("user_id", user.id).eq("video_id", videoId)
      : await db.from("reactions").upsert({ user_id:user.id, video_id:videoId, reaction:value });
    if (result.error) say(result.error.message);
    await drawVideos();
  }

  async function subscribe(channelId) {
    if (!user) return say("Zaloguj się, aby subskrybować.");
    const { data: old } = await db.from("subscriptions").select("channel_id")
      .eq("subscriber_id", user.id).eq("channel_id", channelId).maybeSingle();
    const result = old
      ? await db.from("subscriptions").delete().eq("subscriber_id", user.id).eq("channel_id", channelId)
      : await db.from("subscriptions").insert({ subscriber_id:user.id, channel_id:channelId });
    if (result.error) say(result.error.message);
    await drawVideos();
  }

  async function removeVideo(id, path) {
    if (!confirm("Usunąć ten film?")) return;
    const { error } = await db.from("videos").delete().eq("id", id);
    if (error) return say(error.message);
    await db.storage.from("videos").remove([path]);
    say("Film usunięty.");
    await loadVideos();
  }

  $("filter").oninput = drawVideos;
  db.auth.onAuthStateChange(() => load());
  await load();
</script>
</body>
</html>
